name: Reusable Release Please (Manifest Mode)

on:
  workflow_call:
    inputs:
      config-file:
        description: Path to release-please-config.json
        type: string
        required: false
        default: release-please-config.json
      manifest-file:
        description: Path to .release-please-manifest.json
        type: string
        required: false
        default: .release-please-manifest.json
      default-branch:
        description: Default trunk branch name for release-notes cleanup
        type: string
        required: false
        default: main
      cleanup-release-notes-branch:
        description: Automatically delete release-please--branches--<branch>--release-notes after release creation
        type: boolean
        required: false
        default: true
    outputs:
      release_created:
        description: Whether any release was created during this run
        value: ${{ jobs.release-please.outputs.release_created }}
      tag_name:
        description: Primary tag name created by Release Please
        value: ${{ jobs.release-please.outputs.tag_name }}

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Orchestrate Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Generate Ephemeral GitHub App Token (tupynambalucas-automation)
        id: app-token
        uses: actions/create-github-app-token@c1a285145b9d317df6ced56c09f525b5c2b6f755 # v1.11.1
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID || secrets.CI_BOT_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY || secrets.CI_BOT_PRIVATE_KEY }}

      - name: Run Release Please (Manifest Mode)
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}

      - name: Clean Up Auxiliary Release Notes Branch
        if: ${{ inputs.cleanup-release-notes-branch && steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET_BRANCH: release-please--branches--${{ inputs.default-branch }}--release-notes
        run: |
          status=$(curl -sS -o /dev/null -w "%{http_code}" -X DELETE \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/${TARGET_BRANCH}")
          if [ "$status" = "204" ]; then
            echo "Deleted auxiliary branch '${TARGET_BRANCH}'."
          else
            echo "Auxiliary branch '${TARGET_BRANCH}' not present (HTTP ${status}); nothing to clean."
          fi
